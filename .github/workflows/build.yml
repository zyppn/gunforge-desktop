name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Each platform builds and stashes its output. Nothing touches the GitHub
  # Release here — three jobs racing to create and update the same release is
  # what left v1.4.9 stranded as a draft with a partial asset list.
  build:
    strategy:
      fail-fast: false      # one platform failing must not cancel the others
      matrix:
        include:
          - os: windows-latest
            args: --win
            name: win
          - os: macos-latest
            args: --mac
            name: mac
          - os: ubuntu-latest
            args: --linux
            name: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify loadout-core copies are identical
        run: |
          node -e "const a=require('fs').readFileSync('server/loadout-core.js','utf8'), b=require('fs').readFileSync('renderer/vendor/loadout-core.js','utf8'); if(a!==b){ console.error('loadout-core.js copies have diverged; run npm run sync:core'); process.exit(1); }"

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Stash build output
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.name }}
          retention-days: 1
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml

  # One job, one release, one upload — no race, no half-published draft.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Collect every platform's output
        uses: actions/download-artifact@v4
        with:
          path: staged
          pattern: dist-*
          merge-multiple: true

      - name: Show what will be published
        run: ls -la staged

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: staged/*
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
