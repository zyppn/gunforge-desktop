name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release ONCE, before any build runs.
  #
  # The original workflow let all three matrix jobs create-or-update the release
  # themselves, and they collided over the draft -> published flip: v1.4.9 ended
  # up a permanent draft with a partial asset list. Routing everything through
  # upload-artifact fixed the race but tripled the bytes moved (250MB up per
  # platform, 750MB down, 750MB up again) and took 20+ minutes.
  #
  # Doing it this way keeps the race fix AND the speed: one writer creates the
  # release, then each runner uploads its own output directly, in parallel.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the release up front
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false      # one platform failing must not cancel the others
      matrix:
        include:
          - os: windows-latest
            args: --win
            artifact: "*.exe"
          - os: macos-latest
            args: --mac
            artifact: "*.dmg"
          - os: ubuntu-latest
            args: --linux
            artifact: "*.AppImage"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify loadout-core copies are identical
        run: |
          node -e "const a=require('fs').readFileSync('server/loadout-core.js','utf8'), b=require('fs').readFileSync('renderer/vendor/loadout-core.js','utf8'); if(a!==b){ console.error('loadout-core.js copies have diverged; run npm run sync:core'); process.exit(1); }"

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Uploaded with the gh CLI rather than softprops/action-gh-release, which
      # failed every run on the macOS runner with "Error creating asset temp dir"
      # before uploading a byte. gh does no temp-dir staging.
      #
      # One file at a time, with retries. A single `gh release upload A B C
      # --clobber` gives up on the first failure, and v1.4.17 died with a 404 from
      # uploads.github.com on file 2 of 5 — leaving the release with the dmg but
      # no zip and no latest-mac.yml, which is exactly the pair electron-updater
      # needs on macOS. --clobber also deletes an existing asset and re-uploads
      # the same name in one shot, and that delete is not immediately consistent,
      # so a re-run of the same tag can 404 on its own leftovers. Deleting first
      # as a separate step, then retrying, survives both.
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage dist/*.zip dist/*.blockmap dist/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "::error::no build output to upload"; exit 1; fi

          # Fail loudly here rather than 404ing per asset further down.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::release $TAG does not exist"; exit 1
          fi

          failed=()
          for f in "${files[@]}"; do
            name=$(basename "$f")
            ok=0
            for attempt in 1 2 3; do
              # Clear any leftover of this name from an earlier run, as its own
              # step, so the upload below is a clean create rather than a
              # delete-and-recreate against an eventually-consistent API.
              gh release delete-asset "$TAG" "$name" --yes >/dev/null 2>&1 || true
              sleep $(( attempt * 2 ))
              if gh release upload "$TAG" "$f" >/dev/null 2>&1; then
                echo "uploaded $name (attempt $attempt)"; ok=1; break
              fi
              echo "::warning::upload of $name failed, attempt $attempt of 3"
            done
            [ $ok -eq 1 ] || failed+=("$name")
          done

          if [ ${#failed[@]} -gt 0 ]; then
            echo "::error::failed to upload: ${failed[*]}"; exit 1
          fi

          # A green job that quietly shipped a release missing its updater files
          # is worse than a red one. Confirm every file is actually there.
          #
          # GitHub REWRITES asset filenames on upload: anything outside
          # [A-Za-z0-9._-] becomes a dot, so "GUNFORGE Setup 1.4.19.exe" is stored
          # as "GUNFORGE.Setup.1.4.19.exe". Comparing the local basename to the
          # stored name therefore reported two perfectly good Windows uploads as
          # missing. Normalise both sides the same way before comparing.
          norm(){ printf '%s' "$1" | tr -c 'A-Za-z0-9._-' '.'; }
          echo "--- verifying ---"
          have=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          missing=()
          for f in "${files[@]}"; do
            want=$(norm "$(basename "$f")")
            found=0
            while IFS= read -r a; do
              [ "$(norm "$a")" = "$want" ] && { found=1; break; }
            done <<< "$have"
            [ $found -eq 1 ] || missing+=("$(basename "$f")")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::release is missing after upload: ${missing[*]}"
            echo "assets actually on the release:"; printf '  %s\n' $have
            exit 1
          fi
          echo "all ${#files[@]} assets present on $TAG"
