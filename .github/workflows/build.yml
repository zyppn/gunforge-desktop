name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Create the release ONCE, before any build runs.
  #
  # The original workflow let all three matrix jobs create-or-update the release
  # themselves, and they collided over the draft -> published flip: v1.4.9 ended
  # up a permanent draft with a partial asset list. Routing everything through
  # upload-artifact fixed the race but tripled the bytes moved (250MB up per
  # platform, 750MB down, 750MB up again) and took 20+ minutes.
  #
  # Doing it this way keeps the race fix AND the speed: one writer creates the
  # release, then each runner uploads its own output directly, in parallel.
  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Create the release up front
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          token: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: create-release
    strategy:
      fail-fast: false      # one platform failing must not cancel the others
      matrix:
        include:
          - os: windows-latest
            args: --win
            artifact: "*.exe"
          - os: macos-latest
            args: --mac
            artifact: "*.dmg"
          - os: ubuntu-latest
            args: --linux
            artifact: "*.AppImage"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify loadout-core copies are identical
        run: |
          node -e "const a=require('fs').readFileSync('server/loadout-core.js','utf8'), b=require('fs').readFileSync('renderer/vendor/loadout-core.js','utf8'); if(a!==b){ console.error('loadout-core.js copies have diverged; run npm run sync:core'); process.exit(1); }"

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      # Uploaded with the gh CLI rather than softprops/action-gh-release.
      # That action failed every single run on the macOS runner with
      # "Error creating asset temp dir", ~70s in, before uploading a byte —
      # Windows and Linux were fine. gh is preinstalled on all runners, does no
      # temp-dir staging, and --clobber makes a retry idempotent.
      - name: Upload to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.dmg dist/*.exe dist/*.AppImage dist/*.zip dist/*.blockmap dist/latest*.yml)
          if [ ${#files[@]} -eq 0 ]; then echo "no build output to upload"; exit 1; fi
          printf 'uploading %s\n' "${files[@]}"
          gh release upload "${{ github.ref_name }}" "${files[@]}" --clobber
