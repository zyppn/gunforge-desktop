name: Build and release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            args: --win
            artifact: "*.exe"
          - os: macos-latest
            args: --mac
            artifact: "*.dmg"
          - os: ubuntu-latest
            args: --linux
            artifact: "*.AppImage"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Verify loadout-core copies are identical
        run: |
          node -e "const a=require('fs').readFileSync('server/loadout-core.js','utf8'), b=require('fs').readFileSync('renderer/vendor/loadout-core.js','utf8'); if(a!==b){ console.error('loadout-core.js copies have diverged; run npm run sync:core'); process.exit(1); }"

      - name: Build installer
        run: npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.artifact }}
            dist/*.zip
            dist/*.blockmap
            dist/latest*.yml
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
